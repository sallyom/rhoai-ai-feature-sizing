apiVersion: v1
kind: Secret
metadata:
  name: rhoai-secrets
  namespace: rhoai-ai-feature-sizing
  labels:
    app: rhoai-ai-feature-sizing
type: Opaque
stringData:
  # OpenShift AI model endpoint configuration
  OPENSHIFT_AI_API_KEY: "REPLACE_ME"  # Replace with your actual API key
  OPENSHIFT_AI_BASE_URL: "https://REPLACE_ME"  # Replace with your model endpoint URL
  
  # Optional: OpenAI for embeddings (if not using local embeddings)
  OPENAI_API_KEY: "YOUR_OPENAI_KEY_FOR_EMBEDDINGS"  # Optional: for embeddings only

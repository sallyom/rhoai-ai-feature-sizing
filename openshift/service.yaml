apiVersion: v1
kind: Service
metadata:
  name: rhoai-ai-feature-sizing
  labels:
    app: rhoai-ai-feature-sizing
spec:
  type: ClusterIP
  ports:
  - name: control-plane
    port: 4501
    targetPort: control-plane
    protocol: TCP
  - name: api-server
    port: 8000
    targetPort: api-server
    protocol: TCP
  - name: ui
    port: 3000
    targetPort: ui
    protocol: TCP
  selector:
    app: rhoai-ai-feature-sizing
